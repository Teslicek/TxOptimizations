plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

group   = findProperty('maven_group') ?: 'com.teslicek'
version = findProperty('mod_version') ?: '1.0.0'

base {
    archivesName = "txoptimizations-${project.minecraft_version}"
}

repositories {
    maven {
        url = 'https://maven.caffeinemc.net/releases'
    }
}

loom {
    accessWidenerPath = file('src/main/resources/obe.classtweaker')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release  = 25
    options.encoding = 'UTF-8'
}

dependencies {
    minecraft      "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    compileOnly    "net.caffeinemc:sodium-fabric:${project.sodium_version}"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand version: project.version
    }
}

jar {
    from('LICENSE-OBE')
}

tasks.register('collectJars', Copy) {
    group       = 'build'
    description = 'Copies the built mod JAR into dist/.'
    from tasks.named('jar')
    into layout.projectDirectory.dir('dist')
}

tasks.named('build').configure {
    finalizedBy(tasks.named('collectJars'))
}
