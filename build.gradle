plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

group   = findProperty('maven_group') ?: 'com.teslicek'
version = findProperty('mod_version') ?: '1.0.0'

base {
    archivesName = "txoptimizations-${project.minecraft_version}"
}

loom {
    accessWidenerPath = file('src/main/resources/txoptimizations.classtweaker')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release  = 25
    options.encoding = 'UTF-8'
}

dependencies {
    minecraft      "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

def buildInfoDirectory = layout.buildDirectory.dir('generated/buildinfo')

tasks.register('buildInfo') {
    def commit = providers.exec { commandLine 'git', 'rev-parse', 'HEAD' }.standardOutput.asText.map { it.trim() }
    def dirty  = providers.exec { commandLine 'git', 'status', '--porcelain' }.standardOutput.asText.map { !it.trim().isEmpty() }

    inputs.property 'commit', commit
    inputs.property 'dirty', dirty
    outputs.upToDateWhen { false }
    outputs.dir buildInfoDirectory

    doLast {
        def file = buildInfoDirectory.get().file('txoptimizations-build.properties').asFile

        file.parentFile.mkdirs()
        file.text = ["commit=${commit.get()}", "dirty=${dirty.get()}", "built=${java.time.OffsetDateTime.now()}"].join(System.lineSeparator())
    }
}

sourceSets.main.resources.srcDir(tasks.named('buildInfo'))

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand version: project.version
    }
}

tasks.register('collectJars', Copy) {
    group       = 'build'
    description = 'Copies the built mod JAR into dist/.'
    from tasks.named('jar')
    into layout.projectDirectory.dir('dist')
}

tasks.named('build').configure {
    finalizedBy(tasks.named('collectJars'))
}
